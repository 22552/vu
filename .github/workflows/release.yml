name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.archive_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: vu-linux-x86_64
            binary_name: vu
            archive_ext: tar.gz
          - os: macos-13
            archive_name: vu-macos-x86_64
            binary_name: vu
            archive_ext: tar.gz
          - os: macos-14
            archive_name: vu-macos-aarch64
            binary_name: vu
            archive_ext: tar.gz
          - os: windows-latest
            archive_name: vu-windows-x86_64
            binary_name: vu.exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.archive_name }}
          cp target/release/${{ matrix.binary_name }} dist/${{ matrix.archive_name }}/
          cp README.md LICENSE dist/${{ matrix.archive_name }}/ 2>/dev/null || true
          tar -C dist -czf dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }} ${{ matrix.archive_name }}
          shasum -a 256 dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }} > dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }}.sha256

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.archive_name }}" | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.archive_name }}/"
          if (Test-Path README.md) { Copy-Item README.md "dist/${{ matrix.archive_name }}/" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "dist/${{ matrix.archive_name }}/" }
          Compress-Archive -Path "dist/${{ matrix.archive_name }}/*" -DestinationPath "dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }}"
          $hash = (Get-FileHash "dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive_name }}.${{ matrix.archive_ext }}" | Set-Content -NoNewline "dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }}
            dist/${{ matrix.archive_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
