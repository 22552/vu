[package]
name = "vu"
version = "0.1.0"
edition = "2024"
description = "A tiny PyPI artifact downloader"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
urlencoding = "2.1"
